name: Capture visual audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: npx --yes playwright@1.56.1 install --with-deps chromium
      - name: Capture live desktop and mobile
        run: |
          mkdir -p visual-audit
          npx --yes playwright@1.56.1 screenshot --full-page --viewport-size="1440,900" "https://datacode-app.github.io/sales24-webmcp-demo/?audit=${GITHUB_SHA}" visual-audit/desktop.png
          npx --yes playwright@1.56.1 screenshot --browser=chromium --full-page --viewport-size="390,844" "https://datacode-app.github.io/sales24-webmcp-demo/?audit=${GITHUB_SHA}" visual-audit/mobile.png
      - uses: actions/upload-artifact@v4
        with:
          name: visual-audit
          path: visual-audit/
          retention-days: 7
